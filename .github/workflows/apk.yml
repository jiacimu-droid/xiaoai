name: Build XiaoAi APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Import initial source archive if needed
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive=xiaoai-android-source.zip
          if [ ! -f app/src/main/assets/index.html ] && [ -f "$archive" ]; then
            test "$GITHUB_REF" = refs/heads/main
            python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile, stat
          allowed = {'app', 'ci', 'tests', 'README.md', 'build.gradle', 'settings.gradle', 'gradle.properties', '.gitignore'}
          with zipfile.ZipFile('xiaoai-android-source.zip') as z:
              assert z.testzip() is None, 'corrupt source archive'
              for member in z.infolist():
                  p = PurePosixPath(member.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in member.filename:
                      raise ValueError('unsafe archive path')
                  if stat.S_ISLNK(member.external_attr >> 16):
                      raise ValueError('symlink not allowed')
                  if p.parts and p.parts[0] in allowed:
                      z.extract(member, '.')
          for required in ['app/src/main/assets/index.html', 'app/build.gradle', 'settings.gradle', 'ci/test-signing.jks', 'tests/phone-bridge.test.cjs']:
              assert Path(required).is_file(), 'missing ' + required
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app ci tests README.md build.gradle settings.gradle gradle.properties .gitignore
            git rm -- "$archive"
            git commit -m "Import XiaoAi Android source project"
            git push origin HEAD:main
          fi
          if [ -f app/src/main/assets/index.html ] && [ -f app/build.gradle ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Upload xiaoai-android-source.zip to the root of main to initialize the Android project." >> "$GITHUB_STEP_SUMMARY"
          fi
  apk:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then sdkmanager="$(command -v sdkmanager)"; fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          if [ ! -f "$sdk_root/platforms/android-35/android.jar" ] || [ ! -x "$sdk_root/build-tools/35.0.0/apksigner" ]; then
            (yes || true) | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null
            "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk_root/platforms/android-35/android.jar"
          test -x "$sdk_root/build-tools/35.0.0/apksigner"
      - run: node --check app/src/main/assets/phone-bridge.js && node --check app/src/main/assets/backup-bridge.js && node --test tests/*.test.cjs
      - name: Check fixed private-use signing key
        run: |
          test "$(git hash-object ci/test-signing.jks)" = "c982bfd903de2c03fe9a76e60b3d2696336f5260"
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and stage APK
        run: |
          mkdir -p apk-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk apk-artifacts/XiaoAi.apk
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=apk-artifacts/XiaoAi.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          expected="$(keytool -exportcert -keystore ci/test-signing.jks -storepass xiaoai-debug-only -alias xiaoai-debug | sha256sum | cut -d ' ' -f 1)"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-signature.txt)"
          test "$actual" = "$expected"
          # Read the manifest directly; badging also resolves framework icons and can fail on valid APKs.
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$analyzer" ]; then analyzer="$(command -v apkanalyzer)"; fi
          package_id="$("$analyzer" manifest application-id "$apk")"
          version_code="$("$analyzer" manifest version-code "$apk")"
          echo "Package: $package_id; versionCode: $version_code"
          test "$package_id" = com.xiaoai.phone
          test "$version_code" = "$GITHUB_RUN_NUMBER"
          echo "Fixed package ID, fixed signer and increasing versionCode verified." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoAi-APK
          path: apk-artifacts/*.apk
          if-no-files-found: error
  accessibility:
    needs: [prepare, apk]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        api: [32, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: XiaoAi-APK
          path: apk-artifacts
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real Android accessibility events
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          avd-name: xiaoai-api-${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disk-size: 3G
          emulator-boot-timeout: 240
          disable-animations: true
          script: bash tests/android-accessibility-smoke.sh apk-artifacts/XiaoAi.apk
  publish:
    needs: [prepare, apk, accessibility]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XiaoAi-APK
          path: apk-artifacts
      - name: Publish directly downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          tag="apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" apk-artifacts/XiaoAi.apk --repo "$GITHUB_REPOSITORY" --target "$REVISION" --title "小爱机 APK #${GITHUB_RUN_NUMBER}" --notes "Android 测试版；来源提交 ${REVISION}。"
