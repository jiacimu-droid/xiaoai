name: Build XiaoAi APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_tests:
        description: 'Run Huawei HarmonyOS 4.2 compatibility proxy (Android 12 / API 31)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      full_tests: ${{ steps.mode.outputs.full_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose lightweight or accessibility regression mode
        id: mode
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL_FULL: ${{ inputs.full_tests }}
        run: |
          set -euo pipefail
          full=false
          if [ "$MANUAL_FULL" = true ]; then
            full=true
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            # Fail safe if the previous commit cannot be compared.
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              full=true
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- app/src/main/java app/src/main/kotlin app/src/main/res app/src/main/AndroidManifest.xml app/src/main/assets/phone-bridge.js app/src/main/assets/backup-bridge.js app/build.gradle build.gradle settings.gradle gradle.properties tests ci .github/workflows/apk.yml; then
              full=true
            fi
          fi
          echo "full_tests=$full" >> "$GITHUB_OUTPUT"
          echo "Android accessibility regression: $full" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then sdkmanager="$(command -v sdkmanager)"; fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          if [ ! -f "$sdk_root/platforms/android-35/android.jar" ] || [ ! -x "$sdk_root/build-tools/35.0.0/apksigner" ]; then
            (yes || true) | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null
            "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk_root/platforms/android-35/android.jar"
          test -x "$sdk_root/build-tools/35.0.0/apksigner"
      - name: Verify bridge and runtime diagnostics
        run: node --check app/src/main/assets/phone-bridge.js && node --check app/src/main/assets/speech-input.js && node --test tests/*.test.cjs
      - name: Verify Huawei grant evidence reconciliation
        run: |
          out="$(mktemp -d)"
          javac -d "$out" app/src/main/java/com/xiaoai/phone/GrantEvidence.java tests/GrantEvidenceTest.java
          java -cp "$out" com.xiaoai.phone.GrantEvidenceTest
      - name: Check fixed private-use signing key
        run: |
          test "$(git hash-object ci/test-signing.jks)" = "c982bfd903de2c03fe9a76e60b3d2696336f5260"
      - name: Bundle shared Live2D renderer
        run: |
          node --check app/src/main/assets/live2d-entry.js
          node --check app/src/main/assets/live2d/host.js
          npm install --prefix tools/live2d --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run build --prefix tools/live2d
          test -s app/src/main/assets/live2d/renderer.js
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and stage APK
        run: |
          mkdir -p apk-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk apk-artifacts/XiaoAi.apk
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=apk-artifacts/XiaoAi.apk
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              for asset in ['phone-bridge.js', 'speech-input.js', 'runtime-log.js', 'runtime-log-early.js', 'live2d-entry.js', 'live2d/stage.html', 'live2d/bootstrap.js', 'live2d/host.js', 'live2d/renderer.js']:
                  assert 'assets/' + asset in z.namelist(), asset
              assert not any(p.startswith('assets/live2d/wolf-motions/') or p.endswith('.moc3') for p in z.namelist()), 'private skin asset in APK'
              html = z.read('assets/index.html').decode('utf-8')
              assert 'id="xaNativeRow"' in html and 'id="xaLogStat"' in html
              assert html.index('src="runtime-log-early.js"') < html.index('src="phone-bridge.js"') < html.index('src="runtime-log.js"')
          PY
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          expected="$(keytool -exportcert -keystore ci/test-signing.jks -storepass xiaoai-debug-only -alias xiaoai-debug | sha256sum | cut -d ' ' -f 1)"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-signature.txt)"
          test "$actual" = "$expected"
          # Read the manifest directly; badging also resolves framework icons and can fail on valid APKs.
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$analyzer" ]; then analyzer="$(command -v apkanalyzer)"; fi
          package_id="$("$analyzer" manifest application-id "$apk")"
          version_code="$("$analyzer" manifest version-code "$apk")"
          echo "Package: $package_id; versionCode: $version_code"
          test "$package_id" = com.xiaoai.phone
          test "$version_code" = "$((1220 + GITHUB_RUN_NUMBER))"
          echo "Fixed package ID, fixed signer and increasing versionCode verified." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoAi-APK
          path: apk-artifacts/*.apk
          if-no-files-found: error
  accessibility:
    needs: apk
    if: needs.apk.outputs.full_tests == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: XiaoAi-APK
          path: apk-artifacts
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real Android accessibility events
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          avd-name: xiaoai-huawei-api31
          target: google_apis
          arch: x86_64
          disk-size: 3G
          emulator-boot-timeout: 240
          disable-animations: true
          script: bash tests/android-accessibility-smoke.sh apk-artifacts/XiaoAi.apk
  publish:
    needs: [apk, accessibility]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.apk.result == 'success' && (needs.accessibility.result == 'success' || (needs.apk.outputs.full_tests == 'false' && needs.accessibility.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XiaoAi-APK
          path: apk-artifacts
      - name: Publish directly downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          FULL_TESTS: ${{ needs.apk.outputs.full_tests }}
        run: |
          tag="apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [ "$FULL_TESTS" = true ]; then test_status="Android 12/API 31 无障碍模拟器回归通过；鸿蒙真机待确认"; else test_status="轻量构建，未运行模拟器回归"; fi
          for attempt in 1 2 3; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" apk-artifacts/XiaoAi.apk --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            else
              gh release create "$tag" apk-artifacts/XiaoAi.apk --repo "$GITHUB_REPOSITORY" --target "$REVISION" --title "小爱机 APK #${GITHUB_RUN_NUMBER}" --notes "Android 测试版；来源提交 ${REVISION}。${test_status}。" && exit 0
            fi
            sleep "$((attempt * 2))"
          done
          exit 1
