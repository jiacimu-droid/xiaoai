plugins { id 'com.android.application' }

def webAssets = layout.buildDirectory.dir('generated/xiaoaiWebAssets')
def prepareWebAssets = tasks.register('prepareWebAssets', Sync) {
    filteringCharset = 'UTF-8'
    from('src/main/assets') { exclude 'index.html' }
    from('src/main/assets/index.html') {
        filter { String line ->
            switch (line.trim()) {
                case '<meta charset="UTF-8">':
                    return line + '\n<script src="runtime-log-early.js"></script>'
                case '<script src="phone-bridge.js"></script>':
                    return line + '\n<script src="runtime-log.js"></script>'
                default:
                    return line
            }
        }
    }
    into(webAssets)
}

android {
    namespace 'com.xiaoai.phone'
    compileSdk 35
    defaultConfig {
        applicationId 'com.xiaoai.phone'
        minSdk 26
        targetSdk 34
        versionCode = 1220 + (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0-v1221'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            storeFile rootProject.file('ci/test-signing.jks')
            storePassword 'xiaoai-debug-only'
            keyAlias 'xiaoai-debug'
            keyPassword 'xiaoai-debug-only'
        }
    }
}
android.sourceSets.main.assets.setSrcDirs([webAssets.get().asFile])
tasks.configureEach {
    if (name == 'preBuild' || (name.startsWith('merge') && name.endsWith('Assets'))) {
        dependsOn(prepareWebAssets)
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
